<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Youtube Ad-Free Video</title>
    <style>
      body {
        box-sizing: border-box;
        width: 260px;
        margin: 0;
        padding: 16px;
        color: #202124;
        font: 14px Arial, sans-serif;
      }

      button {
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(135deg, #f04444, #c00);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        box-shadow: 0 2px 5px rgb(153 0 0 / 24%);
        transition: background 150ms ease, box-shadow 150ms ease, transform 150ms ease;
      }

      button:hover {
        background: linear-gradient(135deg, #d93636, #a00);
        box-shadow: 0 4px 9px rgb(153 0 0 / 30%);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      button:focus-visible {
        outline: 3px solid #202124;
        outline-offset: 3px;
      }

      #status {
        margin: 12px 0 0;
        color: #5f6368;
      }

      #status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <button id="redirect" type="button" hidden>Open ad-free video</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="popup.js"></script>
  </body>
</html>
