<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Youtube Ad-Free Video</title>
    <style>
      body {
        box-sizing: border-box;
        width: 260px;
        margin: 0;
        padding: 16px;
        color: #202124;
        font: 14px Arial, sans-serif;
      }

      button {
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(135deg, #f04444, #c00);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        box-shadow: 0 2px 5px rgb(153 0 0 / 24%);
        transition: background 150ms ease, box-shadow 150ms ease, transform 150ms ease;
      }

      button:hover {
        background: linear-gradient(135deg, #d93636, #a00);
        box-shadow: 0 4px 9px rgb(153 0 0 / 30%);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      button:focus-visible {
        outline: 3px solid #202124;
        outline-offset: 3px;
      }

      #status {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 0;
        padding: 12px;
        border: 1px solid #f5d28a;
        border-radius: 10px;
        background: #fff8e6;
        color: #5f4300;
        line-height: 1.45;
      }

      #status[hidden] {
        display: none;
      }

      #status svg {
        width: 20px;
        height: 20px;
        flex: 0 0 20px;
        margin-top: 1px;
        color: #b77900;
      }
    </style>
  </head>
  <body>
    <button id="redirect" type="button" hidden>Open Ad-Free Video</button>
    <p id="status" role="status" aria-live="polite" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.8"></circle>
        <path d="M12 7.5v5.25M12 16.25h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
      </svg>
      <span id="status-message"></span>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
